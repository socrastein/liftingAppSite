    <script>
      // Applies the saved light/dark choice before anything renders, so the page never flashes
      // light then dark. Mirrors src/colorSchemeKey.ts and the library's useColorScheme: same key, same values
      // ('light' | 'dark' | 'auto'; no value or 'auto' follows the system).
      try {
        const saved = localStorage.getItem('liftingApp.colorScheme')
        const followsSystem = saved === null || saved === 'auto'
        const systemIsDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (saved === 'dark' || (followsSystem && systemIsDark)) {
          document.documentElement.classList.add('dark')
        }
      } catch {
        // Storage blocked (private mode, settings): the app falls back to the system choice.
      }
    </script>
